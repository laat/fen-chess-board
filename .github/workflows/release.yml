# Stages a release on npm when a GitHub release is published.
#
# Authentication uses npm trusted publishing (OIDC), so no npm token is
# stored in the repository. The trusted publisher must be configured on
# npmjs.com for this package with:
#   repository: laat/fen-chess-board
#   workflow:   release.yml
#   direct publishing: not allowed (stage only)
#
# To release: bump "version" in package.json, push to master, then create a
# GitHub release whose tag is "v" followed by that version (e.g. v4.0.0).
# This workflow stages the version; approve it with 2FA under "Staged
# Packages" on npmjs.com (or `npm stage approve <stage-id>`) to make it live.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # bundled npm supports trusted publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that the release tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm stage publish --provenance --access public
